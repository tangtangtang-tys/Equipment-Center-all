<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>经销商测试激活与反激活原型</title>
    <style>
      :root {
        --page: #f3f6fa;
        --panel: #ffffff;
        --ink: #1f2937;
        --muted: #667085;
        --line: #d8e0ea;
        --blue: #2563eb;
        --blue-soft: #e9f0ff;
        --green: #11845b;
        --green-soft: #e8f7ef;
        --red: #c73434;
        --red-soft: #fff0f0;
        --amber: #a76500;
        --amber-soft: #fff5db;
        --violet: #6750a4;
        --violet-soft: #f0ecff;
        --shadow: 0 14px 36px rgba(31, 41, 55, 0.12);
        font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
        color: var(--ink);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 1180px;
        background: var(--page);
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 212px 1fr;
      }

      .sidebar {
        background: #172033;
        color: #d5dbea;
        padding: 18px 12px;
      }

      .brand {
        height: 42px;
        display: flex;
        align-items: center;
        padding: 0 10px 16px;
        margin-bottom: 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        color: #fff;
        font-size: 16px;
        font-weight: 700;
      }

      .nav-btn {
        width: 100%;
        height: 38px;
        border: 0;
        border-radius: 4px;
        padding: 0 12px;
        margin-bottom: 6px;
        background: transparent;
        color: #c4cad8;
        text-align: left;
      }

      .nav-btn.active {
        background: #263550;
        color: #fff;
      }

      .workspace {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        height: 50px;
        display: flex;
        align-items: center;
        padding: 0 22px;
        border-bottom: 1px solid var(--line);
        background: #fff;
      }

      .topbar-title {
        font-size: 16px;
        font-weight: 700;
      }

      .topbar-meta {
        margin-left: 12px;
        color: var(--muted);
        font-size: 13px;
      }

      .topbar-right {
        margin-left: auto;
        color: var(--muted);
        font-size: 13px;
      }

      main {
        padding: 18px 22px 28px;
      }

      .toolbar,
      .section,
      .table-wrap,
      .detail-head {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
      }

      .toolbar {
        display: grid;
        grid-template-columns: 1fr 170px 170px auto;
        gap: 10px;
        padding: 12px;
        margin-bottom: 12px;
      }

      .toolbar.dealer-toolbar {
        grid-template-columns: 1fr auto auto auto;
      }

      .toolbar.binding-toolbar {
        grid-template-columns: minmax(180px, 1fr) minmax(220px, 1fr) minmax(300px, 1.2fr);
      }

      .date-range {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 8px;
      }

      .date-range span {
        color: var(--muted);
        font-size: 12px;
      }

      .toolbar-field {
        display: grid;
        gap: 6px;
      }

      .toolbar-field > span {
        color: #475467;
        font-size: 12px;
        font-weight: 700;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-bottom: 12px;
      }

      .metric {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        padding: 12px 14px;
      }

      .metric-label {
        color: var(--muted);
        font-size: 12px;
      }

      .metric-value {
        margin-top: 6px;
        font-size: 24px;
        font-weight: 750;
      }

      .metric.warning .metric-value {
        color: var(--amber);
      }

      .metric.danger .metric-value {
        color: var(--red);
      }

      .metric.ok .metric-value {
        color: var(--green);
      }

      input,
      select,
      textarea {
        width: 100%;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 8px 10px;
        background: #fff;
        color: var(--ink);
        outline: none;
      }

      textarea {
        min-height: 80px;
        resize: vertical;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
      }

      .btn {
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 8px 12px;
        background: #fff;
        color: var(--ink);
        white-space: nowrap;
      }

      .btn.primary {
        border-color: var(--blue);
        background: var(--blue);
        color: #fff;
      }

      .btn.danger {
        border-color: #f1b7b7;
        background: var(--red-soft);
        color: var(--red);
      }

      .btn.link {
        border-color: transparent;
        background: transparent;
        color: var(--blue);
        padding: 4px 6px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }

      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 10px 12px;
        text-align: left;
        vertical-align: middle;
        font-size: 13px;
      }

      th {
        background: #f8fafc;
        color: #475467;
        font-weight: 700;
      }

      tr:last-child td {
        border-bottom: 0;
      }

      .row-title {
        font-weight: 700;
      }

      .row-title-line {
        display: flex;
        align-items: center;
        min-width: 0;
        gap: 8px;
      }

      .row-title-line .row-title {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .row-sub {
        margin-top: 3px;
        color: var(--muted);
        font-size: 12px;
      }

      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .row-tree {
        display: grid;
        grid-template-columns: 24px minmax(0, 1fr);
        align-items: center;
        gap: 4px;
      }

      .tree-toggle {
        width: 24px;
        height: 28px;
        border: 0;
        border-radius: 4px;
        padding: 0;
        background: transparent;
        color: var(--muted);
      }

      .tree-toggle:hover {
        background: var(--blue-soft);
        color: var(--blue);
      }

      .binding-device-cell {
        display: grid;
        grid-template-columns: 24px minmax(0, 1fr);
        align-items: start;
        gap: 6px;
      }

      .binding-history-row td {
        background: #fbfdff;
      }

      .binding-history-panel {
        margin-left: 30px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px;
        background: #fff;
      }

      .binding-history-title {
        margin-bottom: 8px;
        color: #475467;
        font-size: 12px;
        font-weight: 700;
      }

      .binding-history-table {
        width: 100%;
        border-collapse: collapse;
      }

      .binding-history-table th,
      .binding-history-table td {
        padding: 8px 10px;
        font-size: 12px;
      }

      .group-row td {
        background: #fbfdff;
      }

      .muted-cell {
        color: #98a2b3;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        height: 24px;
        border-radius: 4px;
        padding: 0 8px;
        background: #eef2f7;
        color: #475467;
        font-size: 12px;
        white-space: nowrap;
      }

      .tag.ok {
        background: var(--green-soft);
        color: var(--green);
      }

      .tag.info {
        background: var(--blue-soft);
        color: var(--blue);
      }

      .tag.warn {
        background: var(--amber-soft);
        color: var(--amber);
      }

      .tag.danger {
        background: var(--red-soft);
        color: var(--red);
      }

      .tag.violet {
        background: var(--violet-soft);
        color: var(--violet);
      }

      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .detail-head {
        padding: 14px;
        margin-bottom: 12px;
      }

      .breadcrumb {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
        color: var(--muted);
        font-size: 13px;
      }

      .back-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }

      .detail-title {
        font-size: 18px;
        font-weight: 750;
      }

      .detail-title-line {
        display: flex;
        align-items: center;
        min-width: 0;
        gap: 8px;
      }

      .detail-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }

      .detail-stat {
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 10px;
        background: #fafcff;
      }

      .tabs,
      .quick-tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }

      .tab {
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 8px 12px;
        background: #fff;
      }

      .tab.active {
        border-color: var(--blue);
        background: var(--blue-soft);
        color: var(--blue);
      }

      .section {
        padding: 12px;
        margin-bottom: 12px;
      }

      .section-title {
        margin: 0 0 12px;
        font-size: 15px;
        font-weight: 750;
      }

      .empty {
        padding: 24px;
        color: var(--muted);
        text-align: center;
      }

      .notice {
        border: 1px solid #f7d58a;
        border-radius: 5px;
        padding: 10px 12px;
        background: #fffaf0;
        color: var(--amber);
        font-size: 13px;
        line-height: 1.6;
      }

      .usage-note {
        border: 1px solid #bfdbfe;
        border-radius: 5px;
        padding: 9px 12px;
        margin-bottom: 12px;
        background: #f8fbff;
        color: #255077;
        font-size: 12px;
        line-height: 1.55;
      }

      .usage-note strong {
        display: block;
        margin-bottom: 5px;
        color: #174a7c;
        font-size: 13px;
      }

      .usage-note ul {
        margin: 0;
        padding-left: 16px;
      }

      .usage-note li + li {
        margin-top: 2px;
      }

      .usage-note.list {
        margin-top: 10px;
        margin-bottom: 0;
      }

      .drawer-mask {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: none;
        background: rgba(15, 23, 42, 0.32);
      }

      .drawer-mask.show {
        display: block;
      }

      .drawer {
        position: absolute;
        top: 0;
        right: 0;
        width: 520px;
        height: 100%;
        display: flex;
        flex-direction: column;
        background: #fff;
        box-shadow: var(--shadow);
      }

      .drawer.wide {
        width: min(1040px, calc(100vw - 96px));
      }

      .drawer-head,
      .drawer-foot {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
      }

      .drawer-foot {
        margin-top: auto;
        border-top: 1px solid var(--line);
        border-bottom: 0;
        justify-content: flex-end;
      }

      .drawer-title {
        font-weight: 750;
      }

      .drawer-close {
        margin-left: auto;
      }

      .drawer-floating-close {
        position: absolute;
        top: 12px;
        right: 12px;
        z-index: 5;
        width: 30px;
        height: 30px;
        border: 0;
        border-radius: 6px;
        color: var(--muted);
        background: transparent;
      }

      .drawer-floating-close:hover {
        color: var(--blue);
        background: var(--blue-soft);
      }

      .drawer-body {
        padding: 16px;
        overflow: auto;
      }

      .drawer.wide .drawer-body {
        flex: 1;
        padding: 12px;
        background: #f7f9fc;
      }

      .drawer.wide .drawer-head,
      .drawer.wide .drawer-foot {
        display: none;
      }

      .drawer.wide .detail-head,
      .drawer.wide .section {
        padding: 12px;
        margin-bottom: 10px;
      }

      .drawer.wide .back-row {
        flex-wrap: wrap;
      }

      .drawer.wide .detail-title {
        font-size: 16px;
      }

      .drawer.wide .detail-grid {
        gap: 8px;
      }

      .drawer.wide .detail-stat {
        padding: 8px;
      }

      .drawer.wide .metric-value {
        margin-top: 4px;
        font-size: 18px;
      }

      .drawer.wide .tabs,
      .drawer.wide .quick-tabs {
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 10px;
      }

      .drawer.wide .tab {
        padding: 6px 10px;
        font-size: 12px;
      }

      .drawer.wide .table-wrap {
        overflow-x: hidden;
      }

      .drawer.wide th,
      .drawer.wide td {
        padding: 8px 7px;
        font-size: 12px;
        line-height: 1.45;
        white-space: normal;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .drawer.wide th {
        vertical-align: top;
      }

      .drawer.wide .row-title {
        line-height: 1.4;
      }

      .drawer.wide .row-sub {
        line-height: 1.45;
        white-space: normal;
        overflow-wrap: anywhere;
      }

      .drawer.wide .tag {
        height: auto;
        min-height: 22px;
        padding: 2px 6px;
        line-height: 1.3;
        white-space: normal;
      }

      .drawer.wide .btn {
        min-height: 30px;
        padding: 5px 8px;
        font-size: 12px;
      }

      .drawer.wide .actions {
        gap: 6px;
      }

      .drawer.wide .actions .btn {
        padding: 4px 5px;
        white-space: normal;
      }

      .form-grid {
        display: grid;
        gap: 9px;
      }

      .form-section-title {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 2px;
        color: var(--ink);
        font-size: 13px;
        font-weight: 700;
      }

      .form-section-title::before {
        content: "";
        width: 3px;
        height: 14px;
        border-radius: 999px;
        background: var(--blue);
      }

      .field-hint {
        display: block;
        margin-top: 5px;
        color: var(--muted);
        font-size: 12px;
        line-height: 18px;
      }

      .field input[readonly] {
        color: var(--muted);
        background: #f7f9fc;
      }

      .field label {
        display: block;
        margin-bottom: 6px;
        color: #475467;
        font-size: 12px;
        font-weight: 700;
      }

      .timeline {
        display: grid;
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .timeline li {
        border-left: 3px solid var(--line);
        padding-left: 10px;
      }

      .timeline li.done {
        border-color: var(--green);
      }

      .timeline li.risk {
        border-color: var(--red);
      }

      .log-timeline {
        display: grid;
        gap: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
        background: #fff;
      }

      .log-node {
        display: grid;
        grid-template-columns: 30px minmax(0, 1fr);
        gap: 10px;
      }

      .log-node-rail {
        display: grid;
        justify-items: center;
        padding-top: 2px;
      }

      .log-node-dot {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        border: 1px solid #b7e4c7;
        border-radius: 999px;
        color: var(--green);
        background: #f0fff5;
        font-size: 12px;
      }

      .log-node.fail .log-node-dot {
        border-color: #ffccc7;
        color: var(--red);
        background: #fff1f0;
      }

      .log-node-line {
        width: 1px;
        min-height: 64px;
        background: var(--line);
      }

      .log-node-card {
        display: grid;
        gap: 10px;
        min-width: 0;
        padding-bottom: 18px;
      }

      .log-node-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .log-node-title {
        display: grid;
        gap: 4px;
        min-width: 0;
      }

      .log-node-title strong {
        color: var(--text);
        overflow-wrap: anywhere;
      }

      .log-node-meta {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px 16px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
      }

      .log-node-meta span {
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .log-node-note {
        border-radius: 6px;
        padding: 8px 10px;
        color: #475467;
        background: #f7f9fc;
        font-size: 12px;
        line-height: 1.6;
      }

      .toast {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 70;
        display: none;
        min-width: 260px;
        border: 1px solid #b7e4c7;
        border-radius: 6px;
        padding: 12px 14px;
        background: #f0fff5;
        color: var(--green);
        box-shadow: var(--shadow);
      }

      .toast.show {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">设备中心</div>
        <button class="nav-btn active" data-nav="dealers">经销商列表</button>
        <button class="nav-btn" data-nav="logs">App测试操作日志</button>
      </aside>
      <section class="workspace">
        <header class="topbar">
          <div>
            <span class="topbar-title" id="pageTitle">经销商列表</span>
            <span class="topbar-meta">测试激活与反激活演示原型</span>
          </div>
          <div class="topbar-right">平台运营人员 汤彦珊</div>
        </header>
        <main id="app"></main>
      </section>
    </div>

    <div class="drawer-mask" id="drawerMask">
      <aside class="drawer">
        <div class="drawer-head">
          <div class="drawer-title" id="drawerTitle"></div>
          <button class="btn drawer-close" onclick="closeDrawer()">关闭</button>
        </div>
        <div class="drawer-body" id="drawerBody"></div>
        <div class="drawer-foot" id="drawerFoot"></div>
      </aside>
    </div>

    <div class="toast" id="toast"></div>

    <script>

        { id: "DL-1004", name: "华东二级经销商-恒信数码", level: "二级", parentId: "DL-1001", dealerId: "DL-1004" },

        { id: "DL-1003", name: "西部经销商-通达安防", level: "一级", parentId: "REGION-WEST", dealerId: "DL-1003" }
      ];

      function buildDealerHierarchyRows(visibleDealers) {
        const dealerMap = new Map(visibleDealers.map((item) => [item.id, item]));
        const allDealerMap = new Map(dealers.map((item) => [item.id, item]));
        const matchedIds = new Set(visibleDealers.map((item) => item.id));
        const childrenMap = new Map();
        dealerOrgNodes.forEach((node) => {
          const key = node.parentId || "";
          if (!childrenMap.has(key)) childrenMap.set(key, []);
          childrenMap.get(key).push(node);
        });
        const descendants = (nodeId) => {
          const stack = [...(childrenMap.get(nodeId) || [])];
          const result = [];
          while (stack.length) {
            const node = stack.shift();
            result.push(node);
            stack.unshift(...(childrenMap.get(node.id) || []));
          }
          return result;
        };
        const hasMatchedDealer = (node) => {
          if (node.dealerId && matchedIds.has(node.dealerId)) return true;
          return descendants(node.id).some((item) => item.dealerId && matchedIds.has(item.dealerId));
        };
        const buildRows = (parentId, depth = 0) => {
          return (childrenMap.get(parentId) || []).flatMap((node) => {
            if (!hasMatchedDealer(node)) return [];
            const dealer = node.dealerId ? dealerMap.get(node.dealerId) : null;
            const childDealers = descendants(node.id).map((item) => item.dealerId && allDealerMap.get(item.dealerId)).filter(Boolean);
            const aggregateDealers = dealer ? [dealer, ...childDealers] : childDealers;
            const aggregate = {
              accounts: aggregateDealers.reduce((sum, item) => sum + item.accounts, 0),
              deviceTotal: aggregateDealers.reduce((sum, item) => sum + item.deviceTotal, 0),
              enabled: aggregateDealers.some((item) => item.accounts > 0),
              childDealerCount: childDealers.length
            };
            const visibleChildren = (childrenMap.get(node.id) || []).filter(hasMatchedDealer);
            const current = { node, dealer, depth, aggregate, hasChildren: visibleChildren.length > 0 };
            if (!expandedDealerNodes.has(node.id)) return [current];
            return [current, ...buildRows(node.id, depth + 1)];
          });
        };
        return buildRows("ROOT");
      }

            return true;
          })
          .sort((a, b) => b.last.localeCompare(a.last));

        return `
          <div class="toolbar binding-toolbar">
            <label class="toolbar-field">
              <span>设备 ID</span>
              <input value="${bindingDeviceKeyword}" placeholder="请输入设备 ID" oninput="bindingDeviceKeyword=this.value; refreshDealerDetail()" />
            </label>
            <label class="toolbar-field">
              <span>App测试账号 / 用户ID</span>
              <input value="${bindingAccountKeyword}" placeholder="请输入App测试账号或用户ID" oninput="bindingAccountKeyword=this.value; refreshDealerDetail()" />
            </label>
            <label class="toolbar-field">
              <span>添加时间</span>
              <div class="date-range">
                <input type="date" value="${bindingStartDate}" oninput="bindingStartDate=this.value; refreshDealerDetail()" />
                <span>至</span>
                <input type="date" value="${bindingEndDate}" oninput="bindingEndDate=this.value; refreshDealerDetail()" />
              </div>
            </label>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>设备 ID</th>
                  <th>App测试账号</th>
                  <th>添加时间</th>
                </tr>
              </thead>
              <tbody>
                ${list.length ? list.map((item) => {
                  const account = accounts.find((accountItem) => accountItem.org === item.org && accountItem.name === item.account);
                  return `
                  <tr>
                    <td><button class="btn link mono" onclick="openDeviceDrawer('${item.id}')">${item.id}</button></td>
                    <td><div class="row-title">${item.account}</div><div class="row-sub">${account?.userId || "-"}</div></td>
                    <td>${item.last}</td>
                  </tr>
                `;
                }).join("") : `<tr><td colspan="3"><div class="empty">当前筛选下暂无设备测试记录</div></td></tr>`}
              </tbody>
            </table>
          </div>
        `;
      }

      function renderDealerLogs() {
        return renderLogTable(logs.filter((item) => item.org === selectedDealerId));
      }

      function renderGlobalLogs() {
        const list = filterLogs(logs);
        return `
          <div class="toolbar" style="grid-template-columns: 1fr 180px 180px 180px auto">
            <input value="${logKeyword}" placeholder="设备序列号 / App测试账号 / 经销商" oninput="logKeyword=this.value" />
            <select onchange="logType=this.value; render()">
              <option value="全部" ${selected(logType, "全部")}>操作类型：全部</option>
              <option value="创建App测试账号" ${selected(logType, "创建App测试账号")}>创建App测试账号</option>
              <option value="重置App测试账号密码" ${selected(logType, "重置App测试账号密码")}>重置App测试账号密码</option>
              <option value="手动清理" ${selected(logType, "手动清理")}>手动清理</option>
              <option value="重试清理" ${selected(logType, "重试清理")}>重试清理</option>
            </select>
            <select onchange="logResult=this.value; render()">
              <option value="全部" ${selected(logResult, "全部")}>操作结果：全部</option>
              <option value="成功" ${selected(logResult, "成功")}>成功</option>
              <option value="失败" ${selected(logResult, "失败")}>失败</option>
            </select>
            <select onchange="logTimeRange=this.value; render()">
              <option value="最近 7 天" ${selected(logTimeRange, "最近 7 天")}>时间：最近 7 天</option>
              <option value="今天" ${selected(logTimeRange, "今天")}>今天</option>
              <option value="最近 30 天" ${selected(logTimeRange, "最近 30 天")}>最近 30 天</option>
            </select>
            <button class="btn primary" onclick="render()">查询</button>
          </div>
          ${renderLogTable(list)}
        `;
      }

      function filterLogs(source) {
        const keyword = logKeyword.trim();
        return source.filter((item) => {
          const matchKeyword = !keyword || [item.dealer, item.subject, item.type, item.state, item.reason].some((value) => value.includes(keyword));
          const matchType = logType === "全部" || item.type.includes(logType);
          const matchResult = logResult === "全部" || item.result === logResult;
          const matchTime = logTimeRange !== "今天" || item.time.startsWith("2026-07-07");
          return matchKeyword && matchType && matchResult && matchTime;
        });
      }

      function renderLogTable(list) {
        return `
          <div class="log-timeline">
            ${list.length ? list.map((item, index) => `
              <article class="log-node ${item.result === "失败" ? "fail" : ""}">
                <div class="log-node-rail" aria-hidden="true">
                  <span class="log-node-dot">${item.result === "失败" ? "!" : "✓"}</span>
                  ${index < list.length - 1 ? `<span class="log-node-line"></span>` : ""}
                </div>
                <div class="log-node-card">
                  <div class="log-node-head">
                    <div class="log-node-title">
                      <strong>${item.type}</strong>
                      <span class="row-sub">${item.time}</span>
                    </div>
                    ${tag(item.result)}
                  </div>
                  <div class="log-node-meta">
                    <span>经销商：${item.dealer}</span>
                    <span>操作对象：${item.subject}</span>
                    <span>创建人：${item.creator || "-"}</span>
                    <span>关键状态：${item.state}</span>
                  </div>
                  ${item.reason ? `<div class="log-node-note">${item.result === "失败" ? "失败原因" : "操作原因"}：${item.reason}</div>` : ""}
                  <div><button class="btn link" onclick="openLogDrawer('${item.id}')">查看详情</button></div>
                </div>
              </article>
            `).join("") : `<div class="empty">暂无匹配的App测试操作日志</div>`}
          </div>
        `;
      }

      function openCreateDrawer(dealerId) {
        const dealer = dealers.find((item) => item.id === (dealerId || selectedDealerId)) || dealers[0];
        const orgField = `<input value="${dealer.name}" readonly /><input id="createDealerId" type="hidden" value="${dealer.id}" />`;
        document.getElementById("drawerTitle").textContent = "创建App测试账号";
        document.getElementById("drawerBody").innerHTML = `
          ${renderAppTestUsageNote()}
          <div class="form-grid">
            <div class="form-section-title">基础信息</div>
            <div class="field"><label>经销商组织</label>${orgField}</div>
            <div class="field"><label>账号名称</label><input id="createAccountName" placeholder="例如：华东经销商测试员A" /></div>
            <div class="field"><label>手机号（可选）</label><input id="createMobile" placeholder="请输入手机号" /></div>
            <div class="form-section-title">使用范围</div>
            <div class="field"><label>账号所属大区</label><select id="createRegion"><option>中国</option><option>亚洲</option><option>北美</option><option>欧洲</option></select></div>
            <div class="field"><label>客户端名称</label><select id="createClientName" onchange="syncDefaultClient()">${testAccountClients.map((item) => `<option value="${item.clientName}">${item.clientName}</option>`).join("")}</select></div>
            <div class="field"><label>客户端ID</label><input id="createClientId" value="app-xiaoying-kankan" readonly /></div>
            <div class="field"><label>有效期</label><select><option>默认 30 天</option><option>60 天</option><option>90 天</option></select></div>
            <div class="field"><label>创建原因</label><textarea placeholder="请填写抽检批次、测试范围或业务原因"></textarea></div>
          </div>
        `;
        document.getElementById("drawerFoot").innerHTML = `
          <button class="btn" onclick="closeDrawer()">取消</button>
          <button class="btn primary" onclick="submitCreate()">创建账号</button>
        `;
        showDrawer();
      }

      function openDeviceDrawer(deviceId) {
        const item = devices.find((device) => device.id === deviceId);
        if (!item) {
          showToast("未找到设备信息");
          return;
        }
        document.getElementById("drawerTitle").textContent = "设备详情";
        document.getElementById("drawerBody").innerHTML = `
          <div class="section">
            <h3 class="section-title">基础信息</h3>
            <div class="form-grid">
              <div class="field"><label>设备ID</label><input value="${item.id}" readonly /></div>
              <div class="field"><label>设备序列号</label><input value="${item.sn}" readonly /></div>
              <div class="field"><label>设备类型</label><input value="${item.type}" readonly /></div>
              <div class="field"><label>App测试账号</label><input value="${item.account}" readonly /></div>
            </div>
          </div>
          <div class="section">
            <h3 class="section-title">状态链路</h3>
            <ul class="timeline">
              <li class="done"><strong>测试激活</strong><div class="row-sub">${item.activation}</div></li>
              <li class="${item.relation === "已失败" ? "risk" : "done"}"><strong>测试绑定</strong><div class="row-sub">${item.relation}</div></li>
              <li class="${item.deactivation.includes("失败") || item.deactivation.includes("待补偿") ? "risk" : "done"}"><strong>反激活</strong><div class="row-sub">${item.deactivation}</div></li>
              <li><strong>正式接管</strong><div class="row-sub">${item.relation === "已接管" ? "已接管" : "未接管"}</div></li>
            </ul>
          </div>
          <div class="section">
            <h3 class="section-title">4G 与异常</h3>
            <div>${tag(item.type)} ${tag(item.deactivation)}</div>
            <div class="row-sub" style="margin-top: 8px">${item.reason || "暂无异常"}</div>
          </div>
        `;
        document.getElementById("drawerFoot").innerHTML = item.deactivation.includes("失败") || item.deactivation.includes("待补偿")
          ? `<button class="btn" onclick="closeDrawer()">取消</button><button class="btn danger" onclick="retryDeactivation('${item.id}')">重试反激活</button>`
          : `<button class="btn primary" onclick="closeDrawer()">关闭</button>`;
        showDrawer();
      }

      function retryDeactivation(deviceId) {
        const item = devices.find((device) => device.id === deviceId);
        if (!item) {
          showToast("未找到设备信息");
          return;
        }
        item.relation = "反激活中";
        item.deactivation = "处理中";
        item.reason = "已提交反激活重试";
        item.last = "2026-07-07 11:08";
        detailTab = "devices";
        deviceFilter = "反激活中";
        closeDrawer();
        render();
        showToast("已提交反激活重试，状态更新为处理中");
      }

      function openLogByDevice(sn) {
        logKeyword = sn;
        logType = "全部";
        logResult = "全部";
        setView("logs");
        showToast(`已按设备号筛选日志：${sn}`);
      }

      function openLogDrawer(logId) {
        const item = logs.find((log) => log.id === logId);
        if (!item) {
          showToast("未找到日志详情");
          return;
        }
        document.getElementById("drawerTitle").textContent = "App测试操作日志详情";
        document.getElementById("drawerBody").innerHTML = `
          <div class="form-grid">
            <div class="field"><label>日志编号</label><input value="${item.id}" readonly /></div>
            <div class="field"><label>操作时间</label><input value="${item.time}" readonly /></div>
            <div class="field"><label>操作类型</label><input value="${item.type}" readonly /></div>
            <div class="field"><label>操作结果</label><input value="${item.result}" readonly /></div>
            <div class="field"><label>经销商</label><input value="${item.dealer}" readonly /></div>
            <div class="field"><label>创建人</label><input value="${item.creator || "-"}" readonly /></div>
            <div class="field"><label>账号 / 设备</label><input value="${item.subject}" readonly /></div>
            <div class="field"><label>关键状态</label><input value="${item.state}" readonly /></div>
            <div class="field"><label>失败原因</label><textarea readonly>${item.reason || "无"}</textarea></div>
          </div>
        `;
        document.getElementById("drawerFoot").innerHTML = `<button class="btn primary" onclick="closeDrawer()">关闭</button>`;
        showDrawer();
      }

      function syncDefaultClient() {
        const clientName = document.getElementById("createClientName")?.value || "小鹰看看";
        const config = testAccountClients.find((item) => item.clientName === clientName) || testAccountClients[0];
        document.getElementById("createClientId").value = config.clientId;
      }

      function submitCreate() {
        const dealerId = document.getElementById("createDealerId")?.value || selectedDealerId;
        const dealer = dealers.find((item) => item.id === dealerId);
        if (!dealer) {
          showToast("未找到经销商组织");
          return;
        }
        const mobileInput = document.getElementById("createMobile")?.value.trim() || "";
        const accountName = document.getElementById("createAccountName")?.value.trim() || `${dealer.name.replace(/.*-/, "")}测试新账号`;
        const accountSource = "设备中心创建";
        const userId = `U${Date.now().toString().slice(-6)}`;
        const mobile = mobileInput || "待同步";
        const region = document.getElementById("createRegion")?.value || "中国";
        const clientName = document.getElementById("createClientName")?.value || "小鹰看看";
        const clientId = document.getElementById("createClientId")?.value || "app-xiaoying-kankan";
        accounts.push({
          org: dealerId,
          name: accountName,
          userId,
          mobile,
          accountSource,
          region,
          clientName,
          clientId,
          status: "生效中",
          period: "2026-07-07 至 2026-08-06",
          devices: 0,
          last: "创建 2026-07-07"
        });
        logs.unshift({
          id: `LOG-${Date.now().toString().slice(-5)}`,
          org: dealerId,
          time: "2026-07-07 11:08:00",
          type: "创建App测试账号",
          result: "成功",
          dealer: dealer.name,
          subject: accountName,
          state: "生效中",
          reason: `大区：${region}；客户端：${clientName} / ${clientId}`,
          creator: "汤彦珊"
        });
        dealer.accounts += 1;
        dealer.activeAccounts += 1;
        dealer.last = "2026-07-07 11:08";
        closeDrawer();
        render();
        showToast("App测试账号已创建并生效");
      }

      function showDrawer(mode = "") {
        document.querySelector(".drawer").classList.toggle("wide", mode === "wide");
        document.getElementById("drawerMask").classList.add("show");
      }

      function closeDrawer() {
        document.getElementById("drawerMask").classList.remove("show");
        document.querySelector(".drawer").classList.remove("wide");
      }

      function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.classList.add("show");
        window.clearTimeout(window.__toastTimer);
        window.__toastTimer = window.setTimeout(() => toast.classList.remove("show"), 2200);
      }

      window.addEventListener("hashchange", applyRouteFromHash);
      applyRouteFromHash();
    </script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>经销商测试激活与反激活原型</title>
    <style>
      :root {
        --page: #f3f6fa;
        --panel: #ffffff;
        --ink: #1f2937;
        --muted: #667085;
        --line: #d8e0ea;
        --blue: #2563eb;
        --blue-soft: #e9f0ff;
        --green: #11845b;
        --green-soft: #e8f7ef;
        --red: #c73434;
        --red-soft: #fff0f0;
        --amber: #a76500;
        --amber-soft: #fff5db;
        --violet: #6750a4;
        --violet-soft: #f0ecff;
        --shadow: 0 14px 36px rgba(31, 41, 55, 0.12);
        font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
        color: var(--ink);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 1180px;
        background: var(--page);
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 212px 1fr;
      }

      .sidebar {
        background: #172033;
        color: #d5dbea;
        padding: 18px 12px;
      }

      .brand {
        height: 42px;
        display: flex;
        align-items: center;
        padding: 0 10px 16px;
        margin-bottom: 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        color: #fff;
        font-size: 16px;
        font-weight: 700;
      }

      .nav-btn {
        width: 100%;
        height: 38px;
        border: 0;
        border-radius: 4px;
        padding: 0 12px;
        margin-bottom: 6px;
        background: transparent;
        color: #c4cad8;
        text-align: left;
      }

      .nav-btn.active {
        background: #263550;
        color: #fff;
      }

      .workspace {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        height: 50px;
        display: flex;
        align-items: center;
        padding: 0 22px;
        border-bottom: 1px solid var(--line);
        background: #fff;
      }

      .topbar-title {
        font-size: 16px;
        font-weight: 700;
      }

      .topbar-meta {
        margin-left: 12px;
        color: var(--muted);
        font-size: 13px;
      }

      .topbar-right {
        margin-left: auto;
        color: var(--muted);
        font-size: 13px;
      }

      main {
        padding: 18px 22px 28px;
      }

      .toolbar,
      .section,
      .table-wrap,
      .detail-head {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
      }

      .toolbar {
        display: grid;
        grid-template-columns: 1fr 170px 170px auto;
        gap: 10px;
        padding: 12px;
        margin-bottom: 12px;
      }

      .toolbar.dealer-toolbar {
        grid-template-columns: 1fr 150px 170px auto auto auto;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-bottom: 12px;
      }

      .metric {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        padding: 12px 14px;
      }

      .metric-label {
        color: var(--muted);
        font-size: 12px;
      }

      .metric-value {
        margin-top: 6px;
        font-size: 24px;
        font-weight: 750;
      }

      .metric.warning .metric-value {
        color: var(--amber);
      }

      .metric.danger .metric-value {
        color: var(--red);
      }

      .metric.ok .metric-value {
        color: var(--green);
      }

      input,
      select,
      textarea {
        width: 100%;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 8px 10px;
        background: #fff;
        color: var(--ink);
        outline: none;
      }

      textarea {
        min-height: 80px;
        resize: vertical;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
      }

      .btn {
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 8px 12px;
        background: #fff;
        color: var(--ink);
        white-space: nowrap;
      }

      .btn.primary {
        border-color: var(--blue);
        background: var(--blue);
        color: #fff;
      }

      .btn.danger {
        border-color: #f1b7b7;
        background: var(--red-soft);
        color: var(--red);
      }

      .btn.link {
        border-color: transparent;
        background: transparent;
        color: var(--blue);
        padding: 4px 6px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }

      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 10px 12px;
        text-align: left;
        vertical-align: middle;
        font-size: 13px;
      }

      th {
        background: #f8fafc;
        color: #475467;
        font-weight: 700;
      }

      tr:last-child td {
        border-bottom: 0;
      }

      .row-title {
        font-weight: 700;
      }

      .row-sub {
        margin-top: 3px;
        color: var(--muted);
        font-size: 12px;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        height: 24px;
        border-radius: 4px;
        padding: 0 8px;
        background: #eef2f7;
        color: #475467;
        font-size: 12px;
        white-space: nowrap;
      }

      .tag.ok {
        background: var(--green-soft);
        color: var(--green);
      }

      .tag.info {
        background: var(--blue-soft);
        color: var(--blue);
      }

      .tag.warn {
        background: var(--amber-soft);
        color: var(--amber);
      }

      .tag.danger {
        background: var(--red-soft);
        color: var(--red);
      }

      .tag.violet {
        background: var(--violet-soft);
        color: var(--violet);
      }

      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .detail-head {
        padding: 14px;
        margin-bottom: 12px;
      }

      .breadcrumb {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
        color: var(--muted);
        font-size: 13px;
      }

      .back-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }

      .detail-title {
        font-size: 18px;
        font-weight: 750;
      }

      .detail-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }

      .detail-stat {
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 10px;
        background: #fafcff;
      }

      .tabs,
      .quick-tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }

      .tab {
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 8px 12px;
        background: #fff;
      }

      .tab.active {
        border-color: var(--blue);
        background: var(--blue-soft);
        color: var(--blue);
      }

      .section {
        padding: 12px;
        margin-bottom: 12px;
      }

      .section-title {
        margin: 0 0 12px;
        font-size: 15px;
        font-weight: 750;
      }

      .empty {
        padding: 24px;
        color: var(--muted);
        text-align: center;
      }

      .notice {
        border: 1px solid #f7d58a;
        border-radius: 5px;
        padding: 10px 12px;
        background: #fffaf0;
        color: var(--amber);
        font-size: 13px;
        line-height: 1.6;
      }

      .drawer-mask {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: none;
        background: rgba(15, 23, 42, 0.32);
      }

      .drawer-mask.show {
        display: block;
      }

      .drawer {
        position: absolute;
        top: 0;
        right: 0;
        width: 520px;
        height: 100%;
        display: flex;
        flex-direction: column;
        background: #fff;
        box-shadow: var(--shadow);
      }

      .drawer-head,
      .drawer-foot {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
      }

      .drawer-foot {
        margin-top: auto;
        border-top: 1px solid var(--line);
        border-bottom: 0;
        justify-content: flex-end;
      }

      .drawer-title {
        font-weight: 750;
      }

      .drawer-close {
        margin-left: auto;
      }

      .drawer-body {
        padding: 16px;
        overflow: auto;
      }

      .form-grid {
        display: grid;
        gap: 12px;
      }

      .field label {
        display: block;
        margin-bottom: 6px;
        color: #475467;
        font-size: 12px;
        font-weight: 700;
      }

      .timeline {
        display: grid;
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .timeline li {
        border-left: 3px solid var(--line);
        padding-left: 10px;
      }

      .timeline li.done {
        border-color: var(--green);
      }

      .timeline li.risk {
        border-color: var(--red);
      }

      .toast {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 70;
        display: none;
        min-width: 260px;
        border: 1px solid #b7e4c7;
        border-radius: 6px;
        padding: 12px 14px;
        background: #f0fff5;
        color: var(--green);
        box-shadow: var(--shadow);
      }

      .toast.show {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">设备中心</div>
        <button class="nav-btn active" data-nav="dealers">经销商列表</button>
        <button class="nav-btn" data-nav="logs">测试操作日志</button>
      </aside>
      <section class="workspace">
        <header class="topbar">
          <div>
            <span class="topbar-title" id="pageTitle">经销商列表</span>
            <span class="topbar-meta">测试激活与反激活演示原型</span>
          </div>
          <div class="topbar-right">平台运营人员 汤彦珊</div>
        </header>
        <main id="app"></main>
      </section>
    </div>

    <div class="drawer-mask" id="drawerMask">
      <aside class="drawer">
        <div class="drawer-head">
          <div class="drawer-title" id="drawerTitle"></div>
          <button class="btn drawer-close" onclick="closeDrawer()">关闭</button>
        </div>
        <div class="drawer-body" id="drawerBody"></div>
        <div class="drawer-foot" id="drawerFoot"></div>
      </aside>
    </div>

    <div class="toast" id="toast"></div>

    <script>
      const dealers = [
        { id: "DL-1001", name: "华东经销商-智联科技", status: "可用", accounts: 3, activeAccounts: 2, pending: 1, testing: 6, ended: 18, exceptions: 2, risk: "反激活异常", last: "2026-07-07 10:22" },
        { id: "DL-1002", name: "华南经销商-安视电子", status: "可用", accounts: 1, activeAccounts: 1, pending: 0, testing: 3, ended: 9, exceptions: 1, risk: "4G 补偿异常", last: "2026-07-07 09:50" },
        { id: "DL-1003", name: "西部经销商-通达安防", status: "停用", accounts: 2, activeAccounts: 0, pending: 0, testing: 0, ended: 12, exceptions: 0, risk: "正常", last: "2026-07-05 17:12" },
        { id: "DL-1004", name: "华北经销商-恒信数码", status: "可用", accounts: 1, activeAccounts: 1, pending: 0, testing: 2, ended: 6, exceptions: 0, risk: "正常", last: "2026-07-06 16:08" }
      ];

      const accounts = [
        { org: "DL-1001", name: "华东测试01", user: "139****5678", status: "生效中", approval: "已通过", period: "2026-06-15 至 2026-07-15", devices: 4, last: "延期 2026-07-06" },
        { org: "DL-1001", name: "华东测试02", user: "137****9012", status: "生效中", approval: "已通过", period: "2026-05-20 至 2026-08-20", devices: 2, last: "绑定 2026-07-07" },
        { org: "DL-1001", name: "华东测试03", user: "138****1234", status: "审批中", approval: "钉钉审批中", period: "2026-07-07 至 2026-10-05", devices: 0, last: "提交审批 2026-07-06" },
        { org: "DL-1002", name: "华南测试01", user: "132****4567", status: "生效中", approval: "已通过", period: "2026-06-20 至 2026-07-20", devices: 3, last: "绑定 2026-07-07" }
      ];

      const devices = [
        { org: "DL-1001", sn: "IPC4G-20260707001", id: "D-90001", type: "4G 设备", account: "华东测试01", relation: "已失败", activation: "测试激活成功", deactivation: "反激活失败待处理", last: "2026-07-07 10:22", reason: "绑定失败后 4G 通信能力未回收" },
        { org: "DL-1001", sn: "IPC-20260707002", id: "D-90002", type: "普通设备", account: "华东测试02", relation: "生效中", activation: "测试激活成功", deactivation: "无需反激活", last: "2026-07-07 09:42", reason: "" },
        { org: "DL-1001", sn: "IPC4G-20260706009", id: "D-90009", type: "4G 设备", account: "华东测试01", relation: "已解绑", activation: "已反激活", deactivation: "成功", last: "2026-07-06 18:10", reason: "" },
        { org: "DL-1001", sn: "IPC-20260705017", id: "D-90017", type: "普通设备", account: "华东测试02", relation: "已接管", activation: "已转正式激活", deactivation: "无需反激活", last: "2026-07-05 14:12", reason: "" },
        { org: "DL-1002", sn: "IPC4G-20260707011", id: "D-91011", type: "4G 设备", account: "华南测试01", relation: "已失败", activation: "测试激活成功", deactivation: "绑定失败待补偿", last: "2026-07-07 09:50", reason: "应用端超时，测试关系未创建" },
        { org: "DL-1002", sn: "IPC-20260702008", id: "D-91008", type: "普通设备", account: "华南测试01", relation: "生效中", activation: "测试激活成功", deactivation: "无需反激活", last: "2026-07-02 11:21", reason: "" }
      ];

      const logs = [
        { id: "LOG-10001", org: "DL-1001", time: "2026-07-07 10:22:33", type: "反激活补偿", result: "失败", dealer: "华东经销商-智联科技", subject: "IPC4G-20260707001", state: "反激活失败待处理", reason: "4G 通信能力回收失败" },
        { id: "LOG-10002", org: "DL-1001", time: "2026-07-07 10:21:58", type: "测试绑定", result: "失败", dealer: "华东经销商-智联科技", subject: "IPC4G-20260707001", state: "测试激活成功", reason: "设备关系创建失败" },
        { id: "LOG-10003", org: "DL-1001", time: "2026-07-07 09:42:10", type: "测试激活", result: "成功", dealer: "华东经销商-智联科技", subject: "IPC-20260707002", state: "权益隔离成功", reason: "" },
        { id: "LOG-10004", org: "DL-1002", time: "2026-07-07 09:50:03", type: "绑定失败补偿", result: "处理中", dealer: "华南经销商-安视电子", subject: "IPC4G-20260707011", state: "绑定失败待补偿", reason: "应用端超时" },
        { id: "LOG-10005", org: "DL-1001", time: "2026-07-06 18:10:41", type: "反激活", result: "成功", dealer: "华东经销商-智联科技", subject: "IPC4G-20260706009", state: "已反激活", reason: "" }
      ];

      let view = "dealers";
      let selectedDealerId = "DL-1001";
      let detailTab = "accounts";
      let deviceFilter = "全部";
      let dealerKeyword = "";
      let dealerStatus = "全部";
      let dealerRisk = "全部";
      let logKeyword = "";
      let logType = "全部";
      let logResult = "全部";
      let logTimeRange = "最近 7 天";

      function tagTone(value) {
        if (["可用", "生效中", "成功", "已通过", "已反激活", "正常", "已转正式激活"].includes(value)) return "ok";
        if (["审批中", "处理中", "待审批", "测试激活成功", "无需反激活", "反激活中"].includes(value)) return "info";
        if (["反激活异常", "4G 补偿异常", "反激活失败待处理", "绑定失败待补偿", "失败", "已失败"].includes(value)) return "danger";
        if (["停用", "已过期", "已撤销", "已解绑"].includes(value)) return "warn";
        return "";
      }

      function tag(value) {
        return `<span class="tag ${tagTone(value)}">${value}</span>`;
      }

      function selected(current, value) {
        return current === value ? "selected" : "";
      }

      function routeHash() {
        if (view === "dealerDetail") return `#dealer/${selectedDealerId}`;
        return `#${view}`;
      }

      function syncRoute(push) {
        const hash = routeHash();
        if (window.location.hash !== hash) {
          if (push === false) {
            history.replaceState(null, "", hash);
          } else {
            history.pushState(null, "", hash);
          }
        }
      }

      function applyRouteFromHash() {
        const raw = decodeURIComponent(window.location.hash.replace(/^#/, ""));
        if (raw.startsWith("dealer/")) {
          const dealerId = raw.split("/")[1];
          selectedDealerId = dealers.some((item) => item.id === dealerId) ? dealerId : dealers[0].id;
          view = "dealerDetail";
        } else {
          view = raw === "logs" ? "logs" : "dealers";
        }
        closeDrawer();
        updateNav();
        render();
        if (!raw) {
          syncRoute(false);
        }
        window.scrollTo({ top: 0 });
      }

      function updateNav() {
        document.querySelectorAll(".nav-btn").forEach((btn) => {
          const active = view === "dealerDetail" ? btn.dataset.nav === "dealers" : btn.dataset.nav === view;
          btn.classList.toggle("active", active);
        });
      }

      function setView(next) {
        view = next;
        if (next === "dealers") {
          selectedDealerId = dealers[0].id;
          detailTab = "accounts";
          deviceFilter = "全部";
        }
        closeDrawer();
        updateNav();
        render();
        syncRoute(true);
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      document.querySelectorAll(".nav-btn").forEach((btn) => btn.addEventListener("click", () => setView(btn.dataset.nav)));

      function render() {
        const titleMap = {
          dealers: "经销商列表",
          dealerDetail: "经销商详情",
          logs: "测试操作日志"
        };
        document.getElementById("pageTitle").textContent = titleMap[view] || "经销商列表";
        document.getElementById("app").innerHTML = view === "logs" ? renderGlobalLogs() : view === "dealerDetail" ? renderDealerDetailPage() : renderDealers();
      }

      function renderDealers() {
        const totalAccounts = dealers.reduce((sum, item) => sum + item.activeAccounts, 0);
        const testing = dealers.reduce((sum, item) => sum + item.testing, 0);
        const exceptions = dealers.reduce((sum, item) => sum + item.exceptions, 0);
        const keyword = dealerKeyword.trim();
        const visibleDealers = dealers
          .filter((item) => !keyword || item.name.includes(keyword) || item.id.includes(keyword))
          .filter((item) => dealerStatus === "全部" || item.status === dealerStatus)
          .filter((item) => dealerRisk === "全部" || item.risk === dealerRisk)
          .sort((a, b) => b.exceptions - a.exceptions);
        return `
          <div class="metrics">
            <div class="metric"><div class="metric-label">经销商总数</div><div class="metric-value">${dealers.length}</div></div>
            <div class="metric ok"><div class="metric-label">生效中测试账号</div><div class="metric-value">${totalAccounts}</div></div>
            <div class="metric"><div class="metric-label">测试中设备</div><div class="metric-value">${testing}</div></div>
            <div class="metric danger"><div class="metric-label">待处理异常</div><div class="metric-value">${exceptions}</div></div>
          </div>
          <div class="toolbar dealer-toolbar">
            <input value="${dealerKeyword}" placeholder="经销商名称 / 经销商ID" oninput="dealerKeyword=this.value" />
            <select onchange="dealerStatus=this.value; render()">
              <option value="全部" ${selected(dealerStatus, "全部")}>组织状态：全部</option>
              <option value="可用" ${selected(dealerStatus, "可用")}>可用</option>
              <option value="停用" ${selected(dealerStatus, "停用")}>停用</option>
            </select>
            <select onchange="dealerRisk=this.value; render()">
              <option value="全部" ${selected(dealerRisk, "全部")}>异常状态：全部</option>
              <option value="反激活异常" ${selected(dealerRisk, "反激活异常")}>反激活异常</option>
              <option value="4G 补偿异常" ${selected(dealerRisk, "4G 补偿异常")}>4G 补偿异常</option>
              <option value="正常" ${selected(dealerRisk, "正常")}>正常</option>
            </select>
            <button class="btn" onclick="render()">查询</button>
            <button class="btn" onclick="resetDealerFilters()">重置</button>
            <button class="btn primary" onclick="openCreateDrawer()">创建测试账号</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th style="width: 25%">经销商</th>
                  <th>组织状态</th>

      function renderDevices() {
        const filters = ["全部", "测试中", "反激活中", "反激活失败", "绑定失败待补偿", "已反激活", "已接管"];
        const list = devices
          .filter((item) => item.org === selectedDealerId)
          .filter((item) => {
            if (deviceFilter === "全部") return true;
            if (deviceFilter === "测试中") return item.relation === "生效中";
            if (deviceFilter === "反激活失败") return item.deactivation === "反激活失败待处理";
            if (deviceFilter === "绑定失败待补偿") return item.deactivation === "绑定失败待补偿";
            if (deviceFilter === "已反激活") return item.activation === "已反激活";
            if (deviceFilter === "已接管") return item.relation === "已接管";
            if (deviceFilter === "反激活中") return item.deactivation === "处理中";
            return true;
          })
          .sort((a, b) => Number(b.deactivation.includes("失败") || b.deactivation.includes("待补偿")) - Number(a.deactivation.includes("失败") || a.deactivation.includes("待补偿")));

        return `
          <div class="quick-tabs">

                    <td>${tag(item.relation)}</td>

                    <td><div>${tag(item.deactivation)}</div>${item.reason ? `<div class="row-sub">${item.reason}</div>` : ""}</td>

                      <button class="btn link" onclick="openDeviceDrawer('${item.id}')">详情</button>

      function renderDealerLogs() {

      function renderGlobalLogs() {
        const list = filterLogs(logs);
        return `
          <div class="toolbar" style="grid-template-columns: 1fr 180px 180px 180px auto">
            <input value="${logKeyword}" placeholder="设备序列号 / 测试账号 / 经销商" oninput="logKeyword=this.value" />
            <select onchange="logType=this.value; render()">
              <option value="全部" ${selected(logType, "全部")}>操作类型：全部</option>
              <option value="测试激活" ${selected(logType, "测试激活")}>测试激活</option>
              <option value="反激活" ${selected(logType, "反激活")}>反激活</option>
              <option value="补偿" ${selected(logType, "补偿")}>补偿</option>
            </select>
            <select onchange="logResult=this.value; render()">
              <option value="全部" ${selected(logResult, "全部")}>操作结果：全部</option>
              <option value="成功" ${selected(logResult, "成功")}>成功</option>
              <option value="失败" ${selected(logResult, "失败")}>失败</option>

            </select>
            <select onchange="logTimeRange=this.value; render()">
              <option value="最近 7 天" ${selected(logTimeRange, "最近 7 天")}>时间：最近 7 天</option>

            <button class="btn primary" onclick="render()">查询</button>
          </div>
          ${renderLogTable(list)}
        `;
      }

      function filterLogs(source) {
        const keyword = logKeyword.trim();
        return source.filter((item) => {
          const matchKeyword = !keyword || [item.dealer, item.subject, item.type, item.state, item.reason].some((value) => value.includes(keyword));
          const matchType = logType === "全部" || item.type.includes(logType);
          const matchResult = logResult === "全部" || item.result === logResult;
          const matchTime = logTimeRange !== "今天" || item.time.startsWith("2026-07-07");
          return matchKeyword && matchType && matchResult && matchTime;
        });
      }

      function renderLogTable(list) {
        return `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>操作时间</th>

                  <th>失败原因</th>

                    <td>${item.time}</td>
                    <td>${item.type}</td>
                    <td>${tag(item.result)}</td>
                    <td>${item.dealer}</td>

                    <td>${tag(item.state)}</td>

          <div class="form-grid">
            <div class="field"><label>经销商组织</label>${orgField}</div>

      function openDeviceDrawer(deviceId) {

        if (!item) {
          showToast("未找到设备信息");
          return;

        document.getElementById("drawerBody").innerHTML = `
          <div class="section">
            <h3 class="section-title">基础信息</h3>
            <div class="form-grid">
              <div class="field"><label>设备序列号</label><input value="${item.sn}" readonly /></div>
              <div class="field"><label>设备类型</label><input value="${item.type}" readonly /></div>

              <li class="done"><strong>测试激活</strong><div class="row-sub">${item.activation}</div></li>
              <li class="${item.relation === "已失败" ? "risk" : "done"}"><strong>测试绑定</strong><div class="row-sub">${item.relation}</div></li>
              <li class="${item.deactivation.includes("失败") || item.deactivation.includes("待补偿") ? "risk" : "done"}"><strong>反激活</strong><div class="row-sub">${item.deactivation}</div></li>

          : `<button class="btn primary" onclick="closeDrawer()">关闭</button>`;

      function openAccountActionDrawer(action, accountName, deviceCount) {
        const isExtend = action === "延期";
        const account = accounts.find((item) => item.org === selectedDealerId && item.name === accountName) || accounts.find((item) => item.name === accountName);
        if (!account) {
          showToast("未找到测试账号");
          return;
        }
        document.getElementById("drawerTitle").textContent = `${action}测试账号`;
        document.getElementById("drawerBody").innerHTML = `
          <div class="section">
            <h3 class="section-title">账号信息</h3>
            <div class="form-grid">
              <div class="field"><label>测试账号</label><input value="${accountName}" readonly /></div>
              <div class="field"><label>当前状态</label><input value="${account.status}" readonly /></div>
              <div class="field"><label>受影响活跃测试设备</label><input value="${deviceCount} 台" readonly /></div>
            </div>
          </div>
          ${isExtend ? "" : `<div class="notice">确认${action}后，该账号将停止测试权限；未完成正式接管的测试设备进入反激活处理，处理结果写入测试操作日志。</div>`}
          <div class="form-grid">
            ${isExtend ? `<div class="field"><label>新失效时间</label><input value="2026-08-15" /></div>` : ""}
            <div class="field"><label>${action}原因</label><textarea placeholder="请填写${action}原因，操作将写入测试操作日志"></textarea></div>
            ${isExtend ? "" : `<div class="field"><label>影响提示</label><input value="${action}后将撤销测试访问，并触发测试反激活" readonly /></div>`}
          </div>
        `;
        document.getElementById("drawerFoot").innerHTML = `
          <button class="btn" onclick="closeDrawer()">取消</button>
          <button class="btn ${isExtend ? "primary" : "danger"}" onclick="confirmAccountAction('${action}', '${accountName}')">确认${action}</button>
        `;
        showDrawer();
      }

      function confirmAccountAction(action, accountName) {
        const account = accounts.find((item) => item.org === selectedDealerId && item.name === accountName) || accounts.find((item) => item.name === accountName);
        if (!account) {
          showToast("未找到测试账号");
          return;
        }
        if (action === "延期") {
          account.period = account.period.replace(/ 至 .+$/, " 至 2026-08-15");
          account.last = "延期 2026-07-07";
          closeDrawer();
          render();
          showToast("延期已记录，账号有效期已更新");
          return;
        }
        const previousStatus = account.status;
        account.status = action === "撤销" ? "已撤销" : "停用";
        account.last = `${action} 2026-07-07`;
        const affectedDevices = devices.filter((item) => item.org === account.org && item.account === account.name && item.relation !== "已接管" && item.activation !== "已反激活");
        affectedDevices.forEach((item) => {
          item.relation = "反激活中";
          item.deactivation = "处理中";
          item.reason = `${action}测试账号后触发测试反激活`;
          item.last = "2026-07-07 11:08";
        });
        account.devices = 0;
        const dealer = dealers.find((item) => item.id === account.org);
        if (dealer) {
          if (previousStatus === "生效中") dealer.activeAccounts = Math.max(0, dealer.activeAccounts - 1);
          if (previousStatus === "审批中") dealer.pending = Math.max(0, dealer.pending - 1);
          dealer.testing = Math.max(0, dealer.testing - affectedDevices.length);
          dealer.last = "2026-07-07 11:08";
        }
        detailTab = "devices";
        deviceFilter = "反激活中";
        closeDrawer();
        render();
        showToast(`${action}已提交，${affectedDevices.length} 台设备进入反激活中`);
      }

      function retryDeactivation(deviceId) {
        const item = devices.find((device) => device.id === deviceId);
        if (!item) {
          showToast("未找到设备信息");
          return;
        }
        item.relation = "反激活中";
        item.deactivation = "处理中";
        item.reason = "已提交反激活重试";
        item.last = "2026-07-07 11:08";
        detailTab = "devices";
        deviceFilter = "反激活中";
        closeDrawer();
        render();
        showToast("已提交反激活重试，状态更新为处理中");
      }

          </div>

        showDrawer();
      }

      function submitCreate() {
        const dealerId = document.getElementById("createDealerId")?.value || selectedDealerId;
        const dealer = dealers.find((item) => item.id === dealerId);
        if (!dealer) {
          showToast("未找到经销商组织");
          return;
        }
        const accountName = document.getElementById("createAccountName")?.value.trim() || `${dealer.name.replace(/.*-/, "")}测试新账号`;
        const user = document.getElementById("createUser")?.value.trim() || "待补充";
        accounts.push({
          org: dealerId,
          name: accountName,
          user,
          status: "审批中",
          approval: "钉钉审批中",
          period: "2026-07-07 至 2026-08-06",
          devices: 0,
          last: "提交审批 2026-07-07"
        });
        dealer.accounts += 1;
        dealer.pending += 1;
        dealer.last = "2026-07-07 11:08";
        if (view === "dealerDetail") {
          selectedDealerId = dealerId;
          detailTab = "accounts";
        }
        closeDrawer();
        render();
        showToast("测试账号申请已提交钉钉审批");
      }

      function showDrawer() {
        document.getElementById("drawerMask").classList.add("show");
      }

      function closeDrawer() {
        document.getElementById("drawerMask").classList.remove("show");
      }

      function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.classList.add("show");
        window.clearTimeout(window.__toastTimer);
        window.__toastTimer = window.setTimeout(() => toast.classList.remove("show"), 2200);
      }

      window.addEventListener("hashchange", applyRouteFromHash);
      applyRouteFromHash();
    </script>
  </body>
</html>
